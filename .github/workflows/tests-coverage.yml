name: Test Coverage

# A change to retros/ only adds a retrospective note: it tests nothing, so it
# starts no run (#61). The pull_request filter is safe only while no check
# from this workflow is required for merging into main. A skipped workflow
# leaves a required check pending, so a retro-only pull request could never
# merge. If #54 makes a check required, remove the filter from pull_request,
# or add a job that reports success for retro-only changes.
on:
  push:
    branches: [ main ]
    paths-ignore: [ "retros/**" ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ "retros/**" ]

# Every generator in the matrix resolves its @skmtc/* pins (core,
# lang-typescript, lang-kotlin) from public jsr.io — the Kotlin generators'
# lang-kotlin@0.11.3 is published there — so no registry override is
# needed. `private: true` in a member's deno.json gates PUBLISHING only;
# it does not keep the package out of the workspace or this matrix.
jobs:
  coverage:
    runs-on: ubuntu-latest

    strategy:
      # One generator's failure should not cancel the others — a cancelled job
      # reports as failed without having run, which hides which generator
      # actually broke.
      fail-fast: false
      matrix:
        generator:
          - gen-arktype
          - gen-express
          - gen-fetch-example
          - gen-kotlin-jackson
          - gen-kotlin-spring
          - gen-md-docs
          - gen-msw
          - gen-shadcn-form
          - gen-shadcn-select
          - gen-shadcn-table
          - gen-supabase-hono
          - gen-tanstack-query-fetch-zod
          - gen-tanstack-query-supabase-zod
          - gen-typescript
          - gen-valibot
          - gen-zod
          # Workspace invariants: one @skmtc/core pin across every member and one
          # core in deno.lock (#48), and no OS-aware path joins in generator source.
          - test-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        # Caches DENO_DIR keyed on deno.lock, so each job skips re-downloading
        # the jsr/npm graph. setup-deno's key names the job but not the matrix
        # entry, so without the generator in the hash all entries race for one
        # key and the first to finish saves only its own dependencies.
        cache: true
        cache-hash: ${{ hashFiles('**/deno.lock') }}-${{ matrix.generator }}

    - name: Run tests with coverage for ${{ matrix.generator }}
      working-directory: ${{ matrix.generator }}
      run: deno task test:coverage

    # gen-fetch-example is the generator the docs tell readers to clone, and a
    # clone keeps its `skmtc/*` lint rules (#56). It lints clean, so a rule
    # violation in its source fails here instead of reaching every clone.
    - name: Lint ${{ matrix.generator }} with the skmtc rules
      if: matrix.generator == 'gen-fetch-example'
      working-directory: ${{ matrix.generator }}
      run: deno lint

    # gen-arktype compiles its own generated output against real arktype, whose
    # definition parser is type-level — so `deno check` over the emitted files
    # is what proves they are valid. Opt-in because it needs write/run/net.
    - name: Typecheck generated output for ${{ matrix.generator }}
      if: matrix.generator == 'gen-arktype'
      working-directory: ${{ matrix.generator }}
      run: deno task test:typecheck

    - name: Generate LCOV report for ${{ matrix.generator }}
      working-directory: ${{ matrix.generator }}
      run: deno task coverage:report

    - name: Check if coverage report exists
      id: check-coverage
      working-directory: ${{ matrix.generator }}
      run: |
        if [ -f coverage.lcov ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    # Reporting coverage is not a correctness gate, and Coveralls returning 503
    # ("under heavy load (queue full)") was reddening every check in the repo
    # while every test suite passed. An upload outage must not be
    # indistinguishable from a test failure.
    - name: Upload coverage to Coveralls
      if: steps.check-coverage.outputs.exists == 'true'
      continue-on-error: true
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ${{ matrix.generator }}/coverage.lcov
        flag-name: ${{ matrix.generator }}
        parallel: true
        fail-on-error: false

  # Windows is a supported host and its path separator is the one thing
  # the Ubuntu matrix can never exercise (skmtc/skmtc#147: OS-native joins
  # in toExportPath leaking `\` into generated import text). Same matrix,
  # tests only: coverage reporting stays with the Ubuntu job.
  tests-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        generator:
          - gen-arktype
          - gen-express
          - gen-fetch-example
          - gen-kotlin-jackson
          - gen-kotlin-spring
          - gen-md-docs
          - gen-msw
          - gen-shadcn-form
          - gen-shadcn-select
          - gen-shadcn-table
          - gen-supabase-hono
          - gen-tanstack-query-fetch-zod
          - gen-tanstack-query-supabase-zod
          - gen-typescript
          - gen-valibot
          - gen-zod
          # The workspace guard's source walk builds file URLs and relative
          # paths, so it needs the Windows separator check too (#50).
          - test-support

    steps:
    # Line endings stay LF on checkout because of the root .gitattributes, so
    # snapshot and golden comparisons see the committed bytes.
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        # Caches DENO_DIR keyed on deno.lock, so each job skips re-downloading
        # the jsr/npm graph. setup-deno's key names the job but not the matrix
        # entry, so without the generator in the hash all entries race for one
        # key and the first to finish saves only its own dependencies.
        cache: true
        cache-hash: ${{ hashFiles('**/deno.lock') }}-${{ matrix.generator }}

    - name: Run tests for ${{ matrix.generator }}
      working-directory: ${{ matrix.generator }}
      run: deno task test

    # The one test that resolves every generated `@/` import through a real
    # module resolver, so a `\` separator in any import fails here.
    - name: Typecheck generated output for ${{ matrix.generator }}
      if: matrix.generator == 'gen-arktype'
      working-directory: ${{ matrix.generator }}
      run: deno task test:typecheck

  finish:
    needs: coverage
    # Runs even when a generator's tests failed, so the parallel Coveralls build
    # is always closed rather than left hanging.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Close parallel build
      continue-on-error: true
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
        fail-on-error: false
